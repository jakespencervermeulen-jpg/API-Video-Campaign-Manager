services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-campaign-manager-app
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - video-campaign-manager

  nginx:
    image: nginx:alpine
    container_name: video-campaign-manager-nginx
    ports:
      - "8088:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - video-campaign-manager

  db:
    image: mysql:8.0
    container_name: video-campaign-manager-db
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: video_campaign_manager
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - video-campaign-manager

networks:
  video-campaign-manager:
    driver: bridge

volumes:
  dbdata:
